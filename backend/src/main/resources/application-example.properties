spring.application.name=taskmanagement-backend

# ===============================
# DATABASE CONFIGURATION
# ===============================
# Copy this file to application.properties and fill in your values
spring.datasource.url=jdbc:mysql://localhost:3306/task_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===============================
# JWT CONFIGURATION
# ===============================
# Generate a secure Base64-encoded 256-bit key, e.g. using:
#   openssl rand -hex 32 | base64
jwt.secret=YOUR_BASE64_JWT_SECRET_MIN_256_BITS
jwt.expiration=86400000

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# SWAGGER / OPENAPI
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
